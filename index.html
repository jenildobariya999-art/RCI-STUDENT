        window.APP_CONFIG = config;

	async function InitWebFCM_Internal() {
		console.log('InitWebFCM_InternalInitWebFCM_InternalInitWebFCM_Internal');
		if (!('serviceWorker' in navigator)) return;
		if (!('PushManager' in window)) return;
		const permission = await Notification.requestPermission();
		if (permission !== 'granted') return;
		// ä½¿ç¨å·²æ³¨åç PWA ServiceWorker
		const reg = await navigator.serviceWorker.ready;
		// ç­å¾ configPromise å è½½å®æ
		const firebase_vapidKey = await window.configPromise.firebase_vapidKey
		let token = localStorage.getItem("fcm_token");
		if (!token) {
			const messaging = firebase.messaging();
			token = await messaging.getToken({
			vapidKey: firebase_vapidKey,
			serviceWorkerRegistration: reg
			});
			localStorage.setItem("fcm_token", token);
		}
		if(window.channel === "2019999")
		{
			console.log('[WebGL] FCM token:', token);
		}		
		// å Unity
		unityInstance.SendMessage(
			"WebGLCallbackReceiver",
			"OnFCMToken",
			token
		);
	}

	// FisherâYates æ´çï¼çæ­£éæºï¼
	function shuffle(arr) {
		for (let i = arr.length - 1; i > 0; i--) {
		const j = Math.floor(Math.random() * (i + 1));
		[arr[i], arr[j]] = [arr[j], arr[i]];
		}
		return arr;
	}
	
    async function pickAvailableDomain(domains) {
	const shuffled = shuffle(domains.slice());
	for (const d of shuffled) {
		try {
			//console.log(d);
			if(d.startsWith("http://192.168.")){
				return d;
			}
			await fetch("https://"+d, {
				mode: 'no-cors',
				cache: 'no-store'
			});
			return "https://"+d;
		  } catch (e) {}
		}
		throw new Error('All CDN unavailable');
	}
	
	async function GetAppVersion(domain) {
		const ts = Date.now(); // æ¯«ç§æ¶é´æ³
		const d = domain + "/AppVersion.txt"
		const url = d.includes("?")? `${d}&_ts=${ts}`:`${d}?_ts=${ts}`;
		const response = await fetch(url);
        const config = await response.json();
		const item = config.find(entry => entry.channel === window.channel);
		if (item) {
			window.AppVersion = item.version
		}else{
			const fallbackVersion = config[config.length - 1]?.version ?? null;
			window.AppVersion = fallbackVersion
		}
		if(window.channel === "2019999")
		{
			console.log("GetAppVersion url=",url);			
		}		
		console.log("window.channel = ",window.channel,"  appVersion = ", window.AppVersion);
		return window.AppVersion		
	}

	var audioResumePending = false;
	function getUnityAudioContext() {

	function tryResumeUnityAudio(fromUserGesture) {
		var ctx = getUnityAudioContext();
		if (!ctx) return;

		if (ctx.state === "suspended") {
			ctx.resume().then(() => {
				console.log("WebAudio resumed", fromUserGesture ? "(gesture)" : "");
				audioResumePending = false;

				// AudioContext çæ­£æ¢å¤ååéç¥ Unity
				unityInstance?.SendMessage('SoundPlayer', 'ResumeAudio');
			}).catch(err => {
				console.warn("resume failed", err);
				audioResumePending = true;
			});
		} else if (ctx.state === "running") {
			audioResumePending = false;
			unityInstance?.SendMessage('SoundPlayer', 'ResumeAudio');
		}
	}
